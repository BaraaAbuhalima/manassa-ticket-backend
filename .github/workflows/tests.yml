name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TestJettTicketBackend/TestJettTicketBackend.csproj

      - name: Test
        run: dotnet test TestJettTicketBackend/TestJettTicketBackend.csproj --configuration Release --no-restore
