services:
  api:
    build:
      context: .
      dockerfile: jett-exchange-backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      python-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT
      - Stripe__SecretKey
      - Stripe__PublishableKey
      - Stripe__WebhookSecret
      - Jwt__SigningKey
      - RabbitMq__HostName
      - RabbitMq__Port
      - RabbitMq__UserName
      - RabbitMq__Password
      - RabbitMq__VirtualHost
      - RabbitMq__UseTls
      - Smtp__Host
      - Smtp__Port
      - Smtp__Username
      - Smtp__Password
      - Smtp__FromAddress
    volumes:
      - ../../uploads:/app/uploads

  python-service:
    build: ./pdf-ticket-extract-service
    ports:
      - "8000:8000"
    volumes:
      - ../../uploads:/app/uploads

  # Dev-only extras (started when the "dev" profile is active, e.g. via scripts/dev.ps1
  # or COMPOSE_PROFILES=dev in .env). Not part of the production stack.
  # Production connects to an external managed RabbitMQ broker via RabbitMq__* in .env instead.
  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["dev"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMq__UserName:-guest}
      RABBITMQ_DEFAULT_PASS: ${RabbitMq__Password:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"

  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["dev"]
    command: listen --api-key ${STRIPE_API_KEY} --forward-to http://api:8080/api/payment/webhook
    depends_on:
      - api
