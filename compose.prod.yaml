# Production stack. Standalone (does NOT extend compose.yaml) so no build
# context leaks in from the dev file — images are pulled prebuilt from GHCR,
# published by the "Tests and Deploy" GitHub Actions workflow.
#
# Usage on the VPS:
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
services:
  api:
    image: ghcr.io/baraaabuhalima/jett-exchange-api:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - python-service
    environment:
      - ASPNETCORE_ENVIRONMENT
      - ConnectionStrings__Postgres
      - PythonTicketExtractorService__BaseUrl
      - Stripe__SecretKey
      - Stripe__PublishableKey
      - Stripe__WebhookSecret
      - Jwt__SigningKey
      - RabbitMq__Url
      - Smtp__Host
      - Smtp__Port
      - Smtp__EnableSsl
      - Smtp__Username
      - Smtp__Password
      - Smtp__FromAddress
      - Storage__R2__AccountId
      - Storage__R2__AccessKeyId
      - Storage__R2__SecretAccessKey
      - Storage__R2__BucketName

  python-service:
    image: ghcr.io/baraaabuhalima/jett-exchange-python:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8000:8000"
