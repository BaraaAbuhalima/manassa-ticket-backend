# Production stack. Standalone (does NOT extend compose.yaml) so no build
# context leaks in from the dev file — images are pulled prebuilt from GHCR,
# published by the "Tests and Deploy" GitHub Actions workflow.
#
# Usage on the VPS:
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
services:
  api:
    image: ghcr.io/baraaabuhalima/jett-exchange-api:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - python-service
    environment:
      - ASPNETCORE_ENVIRONMENT
      - ConnectionStrings__Postgres
      - PythonTicketExtractorService__BaseUrl
      - Stripe__SecretKey
      - Stripe__PublishableKey
      - Stripe__WebhookSecret
      - Jwt__SigningKey
      - RabbitMq__Url
      - Smtp__Host
      - Smtp__Port
      - Smtp__EnableSsl
      - Smtp__Username
      - Smtp__Password
      - Smtp__FromAddress
      - Storage__R2__AccountId
      - Storage__R2__AccessKeyId
      - Storage__R2__SecretAccessKey
      - Storage__R2__BucketName

  python-service:
    image: ghcr.io/baraaabuhalima/jett-exchange-python:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8000:8000"

  # Static frontend (nginx). Image is built + published by the frontend repo's
  # "Tests and Deploy" workflow; that workflow pulls/restarts this service here.
  frontend:
    image: ghcr.io/baraaabuhalima/jett-exchange-frontend:latest
    pull_policy: always
    restart: unless-stopped

  # Reverse proxy: terminates HTTPS and routes domains to the right container.
  # api.YOURDOMAIN.com -> api:8080  (see Caddyfile)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # frontend is deployed independently by the frontend repo, so it is not a
    # startup dependency here. Caddy proxies to it once it is up.
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
